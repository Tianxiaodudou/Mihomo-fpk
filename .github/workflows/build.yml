name: Build FPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpk-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-22.04
    env:
      MIHOMO_VERSION: v1.19.32
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 递增版本号
        id: ver
        run: python3 tools/bump_version.py

      # 更新日志必须放在打包之前：manifest.changelog 会随 fpk 一起交付，
      # 显示在应用中心的「更新说明」里；放在打包之后会滞后一个版本。
      - name: 生成更新日志（Release 说明 + manifest.changelog）
        run: python3 tools/release_notes.py --version "${{ steps.ver.outputs.version }}"

      - name: 构建 fpk（前端 + Go 双架构 + mihomo 内核 + 打包）
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          python3 tools/build.py

      - name: 校验与摘要
        run: |
          ls -lh build/*.fpk
          sha256sum build/*.fpk > build/SHA256SUMS.txt
          cat build/SHA256SUMS.txt

      # 测试必须放在构建之后：go:embed all:static 依赖 npm 产出的 src/static，
      # static_test.go 还会校验 index.html 里的资源真在嵌入文件系统内。
      - name: Go 单元测试（分流规则顺序 / 静态资源嵌入）
        working-directory: src
        run: |
          log="${RUNNER_TEMP:-/tmp}/gotest.log"
          if ! go test ./... -count=1 -v >"$log" 2>&1; then
            # 失败时把关键行塞进 GitHub 注解：注解在 run 页面公开可读，无需登录即可定位失败用例
            echo "::error title=GoTestFail::$(grep -E '^(--- FAIL|FAIL|ok )|_test\.go:[0-9]+:|no matching files|panic:' "$log" | head -40 | paste -sd'|' -)"
            echo "::error title=GoTestLog::$(tail -n 40 "$log" | paste -sd'|' -)"
            echo "----- go test 输出（末尾 120 行）-----"
            tail -n 120 "$log"
            exit 1
          fi
          tail -n 5 "$log"

      - name: 提交版本号
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest CHANGELOG.md
          if git diff --cached --quiet; then
            echo "manifest 无变更"
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
            git push
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 显式代理 v${{ steps.ver.outputs.version }}
          body_path: build/release_notes.md
          files: |
            build/*.fpk
            build/SHA256SUMS.txt
